version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-clinvo}
      POSTGRES_DB: ${POSTGRES_DB:-clinvo_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - clinvo-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - clinvo-net

volumes:
  pg_data:

networks:
  clinvo-net:
    driver: bridge
